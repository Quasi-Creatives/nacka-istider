name: Uppdatera istider.ics

on:
  schedule:
    # Kör varje natt 03:00 UTC (04:00/05:00 svensk tid beroende på sommartid)
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Kör scriptet som genererar istider.ics
        run: python istider.py

      - name: Commit & push om filen ändrats
        run: |
          if git diff --quiet istider.ics; then
            echo "Inga ändringar i istider.ics"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add istider.ics
          git commit -m "Uppdatera istider.ics via GitHub Actions"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
